version: 2
updates:
  # Workflows pin actions by commit SHA with a version comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Claude Code CLI that "Claude plugin validate" runs, pinned by its lockfile.
  - package-ecosystem: npm
    directory: /ci/claude-code
    schedule:
      interval: weekly
